services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: site-ingest-qdrant
    ports:
      - "6333:6333" # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
